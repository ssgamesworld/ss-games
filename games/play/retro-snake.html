<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Snake — Play on SS GAMES</title>
  <meta name="description" content="Play Retro Snake free online browser game on SS GAMES. Classic snake game! Eat glowing pellets, grow longer and avoid crashing into walls or yourself.">
  <link rel="canonical" href="https://ss-games.pages.dev/games/play/retro-snake.html">
  <link rel="icon" type="image/png" href="../../assets/images/ss-games-logo.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #030712;
      color: #f8fafc;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }
    header {
      width: 100%;
      background: rgba(15, 23, 42, 0.9);
      border-bottom: 1px solid rgba(0, 240, 255, 0.25);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(8px);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #00f0ff;
      text-decoration: none;
      font-weight: 800;
      font-size: 1.1rem;
      letter-spacing: 1.5px;
    }
    .brand img { width: 32px; height: 32px; border-radius: 6px; }
    .back-btn {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.88rem;
      border: 1px solid rgba(255,255,255,0.2);
      padding: 6px 14px;
      border-radius: 20px;
      transition: all 0.2s;
    }
    .back-btn:hover { color: #00f0ff; border-color: #00f0ff; }
    .game-container {
      margin-top: 18px;
      position: relative;
      background: #090d16;
      border: 2px solid rgba(0, 240, 255, 0.4);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 35px rgba(0, 240, 255, 0.2);
    }
    canvas { display: block; background: #030712; cursor: pointer; }
    .hud-bar {
      width: 100%;
      max-width: 600px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      font-size: 0.95rem;
      color: #94a3b8;
    }
    .score-badge { color: #ffd700; font-weight: 700; font-size: 1.1rem; }
    .controls-hint {
      margin-top: 10px;
      font-size: 0.85rem;
      color: #64748b;
      max-width: 600px;
      text-align: center;
      line-height: 1.4;
    }
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(3, 7, 18, 0.88);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }
    .btn-reset {
      background: linear-gradient(135deg, #00f0ff, #0284c7);
      color: #030712;
      border: none;
      padding: 10px 26px;
      border-radius: 20px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 14px;
    }
  </style>
</head>
<body>
  <header>
    <a href="../../index.html" class="brand">
      <img src="../../assets/images/ss-games-logo.png" alt="SS GAMES">
      SS GAMES
    </a>
    <a href="../../games.html" class="back-btn">&larr; Back to Games</a>
  </header>

  <div class="hud-bar">
    <div><strong>Retro Snake</strong> &bull; <span style="color:#00f0ff;">Arcade</span></div>
    <div>Score: <span class="score-badge" id="scoreVal">0</span></div>
  </div>

  <div class="game-container">
    <canvas id="gameCanvas" width="600" height="400"></canvas>
    <div id="gameOverModal" class="modal-overlay">
      <h2 style="color:#ffd700; margin-bottom:8px;">Game Over</h2>
      <p style="color:#94a3b8;">Final Score: <span id="finalScore" style="color:#00f0ff; font-weight:700;">0</span></p>
      <button class="btn-reset" onclick="resetGame(); document.getElementById('gameOverModal').style.display='none';">Play Again</button>
    </div>
  </div>

  <p class="controls-hint">Classic snake game! Eat glowing pellets, grow longer and avoid crashing into walls or yourself.</p>

  <script>
    function updateScore(s) {
      document.getElementById('scoreVal').textContent = s;
    }
    function showGameOver(s) {
      document.getElementById('finalScore').textContent = s;
      document.getElementById('gameOverModal').style.display = 'flex';
    }
    
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const grid = 20;
      let count = 0;
      let snake = { x: 160, y: 160, dx: grid, dy: 0, cells: [], maxCells: 4 };
      let apple = { x: 320, y: 320 };
      let score = 0;
      let running = true;

      function getRandomInt(min, max) { return Math.floor(Math.random() * (max - min)) + min; }
      function resetGame() {
        snake = { x: 160, y: 160, dx: grid, dy: 0, cells: [], maxCells: 4 };
        apple = { x: getRandomInt(0, 25) * grid, y: getRandomInt(0, 20) * grid };
        score = 0;
        updateScore(0);
        running = true;
      }

      function loop() {
        requestAnimationFrame(loop);
        if (!running) return;
        if (++count < 6) return;
        count = 0;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        snake.x += snake.dx;
        snake.y += snake.dy;
        if (snake.x < 0) snake.x = canvas.width - grid;
        else if (snake.x >= canvas.width) snake.x = 0;
        if (snake.y < 0) snake.y = canvas.height - grid;
        else if (snake.y >= canvas.height) snake.y = 0;
        snake.cells.unshift({ x: snake.x, y: snake.y });
        if (snake.cells.length > snake.maxCells) snake.cells.pop();

        ctx.fillStyle = '#ef4444';
        ctx.shadowColor = '#ef4444'; ctx.shadowBlur = 8;
        ctx.fillRect(apple.x, apple.y, grid - 1, grid - 1);
        ctx.shadowBlur = 0;

        ctx.fillStyle = '#00f0ff';
        snake.cells.forEach((cell, index) => {
          ctx.fillRect(cell.x, cell.y, grid - 1, grid - 1);
          if (cell.x === apple.x && cell.y === apple.y) {
            snake.maxCells++;
            score += 10;
            updateScore(score);
            apple.x = getRandomInt(0, 25) * grid;
            apple.y = getRandomInt(0, 20) * grid;
          }
          for (let i = index + 1; i < snake.cells.length; i++) {
            if (cell.x === snake.cells[i].x && cell.y === snake.cells[i].y) {
              running = false;
              showGameOver(score);
            }
          }
        });
      }

      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft' && snake.dx === 0) { snake.dx = -grid; snake.dy = 0; }
        else if (e.key === 'ArrowUp' && snake.dy === 0) { snake.dy = -grid; snake.dx = 0; }
        else if (e.key === 'ArrowRight' && snake.dx === 0) { snake.dx = grid; snake.dy = 0; }
        else if (e.key === 'ArrowDown' && snake.dy === 0) { snake.dy = grid; snake.dx = 0; }
      });
      requestAnimationFrame(loop);
    
  </script>
</body>
</html>
