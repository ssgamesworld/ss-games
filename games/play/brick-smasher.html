<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brick Smasher — Play on SS GAMES</title>
  <meta name="description" content="Play Brick Smasher free online browser game on SS GAMES. Bounce the power ball with your paddle to shatter neon brick formations.">
  <link rel="canonical" href="https://ss-games.pages.dev/games/play/brick-smasher.html">
  <link rel="icon" type="image/png" href="../../assets/images/ss-games-logo.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #030712;
      color: #f8fafc;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }
    header {
      width: 100%;
      background: rgba(15, 23, 42, 0.9);
      border-bottom: 1px solid rgba(0, 240, 255, 0.25);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(8px);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #00f0ff;
      text-decoration: none;
      font-weight: 800;
      font-size: 1.1rem;
      letter-spacing: 1.5px;
    }
    .brand img { width: 32px; height: 32px; border-radius: 6px; }
    .back-btn {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.88rem;
      border: 1px solid rgba(255,255,255,0.2);
      padding: 6px 14px;
      border-radius: 20px;
      transition: all 0.2s;
    }
    .back-btn:hover { color: #00f0ff; border-color: #00f0ff; }
    .game-container {
      margin-top: 18px;
      position: relative;
      background: #090d16;
      border: 2px solid rgba(0, 240, 255, 0.4);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 35px rgba(0, 240, 255, 0.2);
    }
    canvas { display: block; background: #030712; cursor: pointer; }
    .hud-bar {
      width: 100%;
      max-width: 600px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      font-size: 0.95rem;
      color: #94a3b8;
    }
    .score-badge { color: #ffd700; font-weight: 700; font-size: 1.1rem; }
    .controls-hint {
      margin-top: 10px;
      font-size: 0.85rem;
      color: #64748b;
      max-width: 600px;
      text-align: center;
      line-height: 1.4;
    }
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(3, 7, 18, 0.88);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }
    .btn-reset {
      background: linear-gradient(135deg, #00f0ff, #0284c7);
      color: #030712;
      border: none;
      padding: 10px 26px;
      border-radius: 20px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 14px;
    }
  </style>
</head>
<body>
  <header>
    <a href="../../index.html" class="brand">
      <img src="../../assets/images/ss-games-logo.png" alt="SS GAMES">
      SS GAMES
    </a>
    <a href="../../games.html" class="back-btn">&larr; Back to Games</a>
  </header>

  <div class="hud-bar">
    <div><strong>Brick Smasher</strong> &bull; <span style="color:#00f0ff;">Arcade</span></div>
    <div>Score: <span class="score-badge" id="scoreVal">0</span></div>
  </div>

  <div class="game-container">
    <canvas id="gameCanvas" width="600" height="400"></canvas>
    <div id="gameOverModal" class="modal-overlay">
      <h2 style="color:#ffd700; margin-bottom:8px;">Game Over</h2>
      <p style="color:#94a3b8;">Final Score: <span id="finalScore" style="color:#00f0ff; font-weight:700;">0</span></p>
      <button class="btn-reset" onclick="resetGame(); document.getElementById('gameOverModal').style.display='none';">Play Again</button>
    </div>
  </div>

  <p class="controls-hint">Bounce the power ball with your paddle to shatter neon brick formations.</p>

  <script>
    function updateScore(s) {
      document.getElementById('scoreVal').textContent = s;
    }
    function showGameOver(s) {
      document.getElementById('finalScore').textContent = s;
      document.getElementById('gameOverModal').style.display = 'flex';
    }
    
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      let paddle = { x: 260, w: 90, h: 14 };
      let ball = { x: 300, y: 250, dx: 3.5, dy: -3.5, r: 7 };
      let bricks = [];
      let score = 0;
      let running = true;

      function initBricks() {
        bricks = [];
        for (let r = 0; r < 5; r++) {
          for (let c = 0; c < 8; c++) {
            bricks.push({ x: c * 70 + 25, y: r * 25 + 30, w: 60, h: 18, alive: true });
          }
        }
      }
      initBricks();

      function resetGame() {
        paddle.x = 260;
        ball = { x: 300, y: 250, dx: 3.5, dy: -3.5, r: 7 };
        initBricks();
        score = 0;
        updateScore(0);
        running = true;
      }

      canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        paddle.x = e.clientX - rect.left - paddle.w / 2;
      });

      function loop() {
        requestAnimationFrame(loop);
        if (!running) return;
        ctx.fillStyle = '#030712';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ball.x += ball.dx; ball.y += ball.dy;
        if (ball.x < ball.r || ball.x > canvas.width - ball.r) ball.dx *= -1;
        if (ball.y < ball.r) ball.dy *= -1;

        // Paddle Collision
        if (ball.y + ball.r > canvas.height - 30 && ball.x > paddle.x && ball.x < paddle.x + paddle.w) {
          ball.dy = -Math.abs(ball.dy);
        }

        if (ball.y > canvas.height) {
          running = false;
          showGameOver(score);
        }

        // Brick collision
        bricks.forEach(b => {
          if (!b.alive) return;
          ctx.fillStyle = '#00f0ff';
          ctx.fillRect(b.x, b.y, b.w, b.h);
          if (ball.x > b.x && ball.x < b.x + b.w && ball.y > b.y && ball.y < b.y + b.h) {
            b.alive = false;
            ball.dy *= -1;
            score += 20;
            updateScore(score);
          }
        });

        // Draw Paddle & Ball
        ctx.fillStyle = '#ec4899';
        ctx.fillRect(paddle.x, canvas.height - 25, paddle.w, paddle.h);
        ctx.fillStyle = '#ffd700';
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
        ctx.fill();
      }
      requestAnimationFrame(loop);
    
  </script>
</body>
</html>
