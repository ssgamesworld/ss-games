<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Flip — Play on SS GAMES</title>
  <meta name="description" content="Play Memory Flip free online browser game on SS GAMES. Test your brain! Flip pairs of cards to match symbols before the clock runs out.">
  <link rel="canonical" href="https://ss-games.pages.dev/games/play/memory-flip.html">
  <link rel="icon" type="image/png" href="../../assets/images/ss-games-logo.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #030712;
      color: #f8fafc;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }
    header {
      width: 100%;
      background: rgba(15, 23, 42, 0.9);
      border-bottom: 1px solid rgba(0, 240, 255, 0.25);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(8px);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #00f0ff;
      text-decoration: none;
      font-weight: 800;
      font-size: 1.1rem;
      letter-spacing: 1.5px;
    }
    .brand img { width: 32px; height: 32px; border-radius: 6px; }
    .back-btn {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.88rem;
      border: 1px solid rgba(255,255,255,0.2);
      padding: 6px 14px;
      border-radius: 20px;
      transition: all 0.2s;
    }
    .back-btn:hover { color: #00f0ff; border-color: #00f0ff; }
    .game-container {
      margin-top: 18px;
      position: relative;
      background: #090d16;
      border: 2px solid rgba(0, 240, 255, 0.4);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 35px rgba(0, 240, 255, 0.2);
    }
    canvas { display: block; background: #030712; cursor: pointer; }
    .hud-bar {
      width: 100%;
      max-width: 600px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      font-size: 0.95rem;
      color: #94a3b8;
    }
    .score-badge { color: #ffd700; font-weight: 700; font-size: 1.1rem; }
    .controls-hint {
      margin-top: 10px;
      font-size: 0.85rem;
      color: #64748b;
      max-width: 600px;
      text-align: center;
      line-height: 1.4;
    }
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(3, 7, 18, 0.88);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }
    .btn-reset {
      background: linear-gradient(135deg, #00f0ff, #0284c7);
      color: #030712;
      border: none;
      padding: 10px 26px;
      border-radius: 20px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 14px;
    }
  </style>
</head>
<body>
  <header>
    <a href="../../index.html" class="brand">
      <img src="../../assets/images/ss-games-logo.png" alt="SS GAMES">
      SS GAMES
    </a>
    <a href="../../games.html" class="back-btn">&larr; Back to Games</a>
  </header>

  <div class="hud-bar">
    <div><strong>Memory Flip</strong> &bull; <span style="color:#00f0ff;">Puzzle</span></div>
    <div>Score: <span class="score-badge" id="scoreVal">0</span></div>
  </div>

  <div class="game-container">
    <canvas id="gameCanvas" width="600" height="400"></canvas>
    <div id="gameOverModal" class="modal-overlay">
      <h2 style="color:#ffd700; margin-bottom:8px;">Game Over</h2>
      <p style="color:#94a3b8;">Final Score: <span id="finalScore" style="color:#00f0ff; font-weight:700;">0</span></p>
      <button class="btn-reset" onclick="resetGame(); document.getElementById('gameOverModal').style.display='none';">Play Again</button>
    </div>
  </div>

  <p class="controls-hint">Test your brain! Flip pairs of cards to match symbols before the clock runs out.</p>

  <script>
    function updateScore(s) {
      document.getElementById('scoreVal').textContent = s;
    }
    function showGameOver(s) {
      document.getElementById('finalScore').textContent = s;
      document.getElementById('gameOverModal').style.display = 'flex';
    }
    
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const symbols = ['⭐', '💎', '🚀', '⚡', '🔥', '🎯', '🌙', '👾'];
      let cards = [];
      let flipped = [];
      let score = 0;

      function resetGame() {
        const deck = [...symbols, ...symbols].sort(() => Math.random() - 0.5);
        cards = deck.map((sym, i) => ({
          sym,
          revealed: false,
          matched: false,
          x: (i % 4) * 110 + 90,
          y: Math.floor(i / 4) * 85 + 40,
          w: 85,
          h: 70
        }));
        flipped = [];
        score = 0;
        updateScore(0);
        draw();
      }

      function draw() {
        ctx.fillStyle = '#090d16';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        cards.forEach(c => {
          if (c.matched) {
            ctx.fillStyle = 'rgba(0, 240, 255, 0.2)';
            ctx.fillRect(c.x, c.y, c.w, c.h);
          } else if (c.revealed) {
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(c.x, c.y, c.w, c.h);
            ctx.font = '28px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(c.sym, c.x + c.w / 2, c.y + c.h / 2 + 10);
          } else {
            ctx.fillStyle = '#00f0ff';
            ctx.fillRect(c.x, c.y, c.w, c.h);
          }
        });
      }

      canvas.addEventListener('click', (e) => {
        if (flipped.length >= 2) return;
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left, my = e.clientY - rect.top;
        cards.forEach(c => {
          if (!c.matched && !c.revealed && mx > c.x && mx < c.x + c.w && my > c.y && my < c.y + c.h) {
            c.revealed = true;
            flipped.push(c);
            draw();
            if (flipped.length === 2) {
              setTimeout(() => {
                if (flipped[0].sym === flipped[1].sym) {
                  flipped[0].matched = true;
                  flipped[1].matched = true;
                  score += 100;
                  updateScore(score);
                  if (cards.every(k => k.matched)) showGameOver(score);
                } else {
                  flipped[0].revealed = false;
                  flipped[1].revealed = false;
                }
                flipped = [];
                draw();
              }, 700);
            }
          }
        });
      });
      resetGame();
    
  </script>
</body>
</html>
