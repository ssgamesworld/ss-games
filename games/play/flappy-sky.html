<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy Sky — Play on SS GAMES</title>
  <meta name="description" content="Play Flappy Sky free online browser game on SS GAMES. Tap to flap your wings and navigate safely through tricky pipes in the sky.">
  <link rel="canonical" href="https://ss-games.pages.dev/games/play/flappy-sky.html">
  <link rel="icon" type="image/png" href="../../assets/images/ss-games-logo.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #030712;
      color: #f8fafc;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }
    header {
      width: 100%;
      background: rgba(15, 23, 42, 0.9);
      border-bottom: 1px solid rgba(0, 240, 255, 0.25);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(8px);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #00f0ff;
      text-decoration: none;
      font-weight: 800;
      font-size: 1.1rem;
      letter-spacing: 1.5px;
    }
    .brand img { width: 32px; height: 32px; border-radius: 6px; }
    .back-btn {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.88rem;
      border: 1px solid rgba(255,255,255,0.2);
      padding: 6px 14px;
      border-radius: 20px;
      transition: all 0.2s;
    }
    .back-btn:hover { color: #00f0ff; border-color: #00f0ff; }
    .game-container {
      margin-top: 18px;
      position: relative;
      background: #090d16;
      border: 2px solid rgba(0, 240, 255, 0.4);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 35px rgba(0, 240, 255, 0.2);
    }
    canvas { display: block; background: #030712; cursor: pointer; }
    .hud-bar {
      width: 100%;
      max-width: 600px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      font-size: 0.95rem;
      color: #94a3b8;
    }
    .score-badge { color: #ffd700; font-weight: 700; font-size: 1.1rem; }
    .controls-hint {
      margin-top: 10px;
      font-size: 0.85rem;
      color: #64748b;
      max-width: 600px;
      text-align: center;
      line-height: 1.4;
    }
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(3, 7, 18, 0.88);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }
    .btn-reset {
      background: linear-gradient(135deg, #00f0ff, #0284c7);
      color: #030712;
      border: none;
      padding: 10px 26px;
      border-radius: 20px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 14px;
    }
  </style>
</head>
<body>
  <header>
    <a href="../../index.html" class="brand">
      <img src="../../assets/images/ss-games-logo.png" alt="SS GAMES">
      SS GAMES
    </a>
    <a href="../../games.html" class="back-btn">&larr; Back to Games</a>
  </header>

  <div class="hud-bar">
    <div><strong>Flappy Sky</strong> &bull; <span style="color:#00f0ff;">Arcade</span></div>
    <div>Score: <span class="score-badge" id="scoreVal">0</span></div>
  </div>

  <div class="game-container">
    <canvas id="gameCanvas" width="600" height="400"></canvas>
    <div id="gameOverModal" class="modal-overlay">
      <h2 style="color:#ffd700; margin-bottom:8px;">Game Over</h2>
      <p style="color:#94a3b8;">Final Score: <span id="finalScore" style="color:#00f0ff; font-weight:700;">0</span></p>
      <button class="btn-reset" onclick="resetGame(); document.getElementById('gameOverModal').style.display='none';">Play Again</button>
    </div>
  </div>

  <p class="controls-hint">Tap to flap your wings and navigate safely through tricky pipes in the sky.</p>

  <script>
    function updateScore(s) {
      document.getElementById('scoreVal').textContent = s;
    }
    function showGameOver(s) {
      document.getElementById('finalScore').textContent = s;
      document.getElementById('gameOverModal').style.display = 'flex';
    }
    
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      let bird = { x: 80, y: 150, vy: 0, r: 14 };
      let pipes = [];
      let score = 0;
      let frame = 0;
      let running = true;

      function resetGame() {
        bird = { x: 80, y: 150, vy: 0, r: 14 };
        pipes = [];
        score = 0;
        frame = 0;
        updateScore(0);
        running = true;
      }

      function flap() {
        if (!running) { resetGame(); return; }
        bird.vy = -6.5;
      }
      window.addEventListener('keydown', (e) => { if (e.code === 'Space') flap(); });
      canvas.addEventListener('pointerdown', flap);

      function loop() {
        requestAnimationFrame(loop);
        if (!running) return;
        ctx.fillStyle = '#090d16';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        bird.vy += 0.35;
        bird.y += bird.vy;

        if (++frame % 90 === 0) {
          const gap = 110;
          const topH = Math.floor(Math.random() * (canvas.height - gap - 60)) + 30;
          pipes.push({ x: canvas.width, top: topH, bottom: topH + gap, passed: false });
        }

        pipes.forEach((p, idx) => {
          p.x -= 2.5;
          ctx.fillStyle = '#00f0ff';
          ctx.fillRect(p.x, 0, 40, p.top);
          ctx.fillRect(p.x, p.bottom, 40, canvas.height - p.bottom);

          if (!p.passed && p.x < bird.x) {
            p.passed = true;
            score += 1;
            updateScore(score);
          }

          if (bird.x + bird.r > p.x && bird.x - bird.r < p.x + 40) {
            if (bird.y - bird.r < p.top || bird.y + bird.r > p.bottom) {
              running = false;
              showGameOver(score);
            }
          }
        });

        pipes = pipes.filter(p => p.x > -50);

        if (bird.y > canvas.height || bird.y < 0) {
          running = false;
          showGameOver(score);
        }

        // Draw bird
        ctx.fillStyle = '#ffd700';
        ctx.beginPath();
        ctx.arc(bird.x, bird.y, bird.r, 0, Math.PI * 2);
        ctx.fill();
      }
      requestAnimationFrame(loop);
    
  </script>
</body>
</html>
