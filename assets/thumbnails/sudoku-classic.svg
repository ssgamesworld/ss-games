<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_sudoku-classic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="glow_sudoku-classic" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a5b4fc"/>
    </linearGradient>
  </defs>

  <rect width="400" height="240" fill="url(#bg_sudoku-classic)"/>

  <circle cx="340" cy="40" r="70" fill="#6366f1" opacity="0.12"/>
  <circle cx="60" cy="200" r="90" fill="#a5b4fc" opacity="0.08"/>

  <rect x="15" y="15" width="370" height="210" rx="10" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.4"/>

  <g transform="translate(30, 36)">
    <rect width="84" height="22" rx="4" fill="#6366f1" opacity="0.3"/>
    <text x="42" y="15" fill="#a5b4fc" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1.5">PUZZLE</text>
  </g>

  <text x="200" y="125" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="900" text-anchor="middle" letter-spacing="1">
    Sudoku Classic
  </text>

  <text x="200" y="155" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="500">
    SS GAMES &bull; 2D BROWSER GAME
  </text>

  <g transform="translate(150, 180)">
    <rect width="100" height="26" rx="13" fill="url(#glow_sudoku-classic)" opacity="0.95"/>
    <polygon points="44,8 44,18 54,13" fill="#020617"/>
    <text x="66" y="17" fill="#020617" font-family="sans-serif" font-size="10" font-weight="800">PLAY</text>
  </g>
