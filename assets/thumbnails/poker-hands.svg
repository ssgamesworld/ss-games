<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_poker-hands" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="glow_poker-hands" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
  </defs>

  <rect width="400" height="240" fill="url(#bg_poker-hands)"/>

  <circle cx="340" cy="40" r="70" fill="#f59e0b" opacity="0.12"/>
  <circle cx="60" cy="200" r="90" fill="#fde68a" opacity="0.08"/>

  <rect x="15" y="15" width="370" height="210" rx="10" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.4"/>

