    <text x="42" y="15" fill="#fde68a" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1.5">BOARD</text>
  </g>

  <text x="200" y="125" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="900" text-anchor="middle" letter-spacing="1">
